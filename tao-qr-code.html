<html lang="vi">
  <head>
    <meta charset="utf-8">
    <title>Tạo mã QR</title>
    <meta name="description" content="tạo qr code">
    <meta name="keywords" content="tạo qr code, tao qr code, trình tạo mã qr, tạo mã qr, qr code generator, tạo mã qr miễn phí, tạo qr code miễn phí, tạo qr code online, tạo mã qr trực tuyến, tạo mã qr không giới hạn, tạo qr code chuyên nghiệp, tạo qr không quảng cáo, tạo qr code không quảng cáo" />
    <meta name="robots" content="index,follow" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link href="css/style.css" rel="stylesheet">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
	<script type="application/ld+json">
	{
	  "@context": "https://schema.org",
	  "@type": "WebApplication",
	  "name": "Công cụ tạo mã qr",
	  "url": "https://apptax.net/tao-qr-code.html",
	  "applicationCategory": "BusinessApplication",
	  "operatingSystem": "All",
	  "browserRequirements": "Requires HTML5/JavaScript",
	  "description": "Ứng dụng trực tuyến tạo mã qr"
	}
	</script>
	<style>
	  .qr-box canvas{ max-width:100%; height:auto; border-radius:6px; }
	  .color-swatch{ width:42px; height:38px; padding:2px; }
	  .logo-thumb{
		width:40px; height:40px; border:1px solid #dee2e6; border-radius:6px;
		display:flex; align-items:center; justify-content:center; overflow:hidden;
		background:#fff; flex-shrink:0; font-size:11px; color:#6c757d;
	  }
	  .logo-thumb img{ width:100%; height:100%; object-fit:cover; }
	</style>
  </head>
  <body>
    <div class="container">
        <nav class="navbar navbar-expand-lg navbar-light bg-light" w3-include-html="menu.html">
        </nav>
        <div class="row">
            <div class="col-sm-9">
				<div class="vbpl-top-qc" style="margin-bottom: 15px; text-align: center;">
                <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5450749028139171" crossorigin="anonymous"></script>
                <!-- vbpl_top -->
                <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5450749028139171" data-ad-slot="2084633661" data-ad-format="auto" data-full-width-responsive="true"></ins>
                <script>
                     (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
              </div>
                
      <div>
        <div class="card-body p-4">
          <h4 class="card-title mb-1">Tạo mã QR</h4>
          <p class="text-muted small mb-4">Nhập link, tuỳ chỉnh màu sắc, logo và kích thước.</p>

          <div class="mb-3">
            <label for="link" class="form-label">Link</label>
            <input type="text" class="form-control" id="link" placeholder="Ví dụ: https://apptax.net hoặc https://apptax.net/van-ban-phap-luat.html">
          </div>

          <div class="mb-3">
            <label class="form-label">Kích thước</label>
            <div class="btn-group w-100" role="group" id="sizeGroup">
              <button type="button" class="btn btn-outline-secondary size-btn active" data-size="180">Nhỏ</button>
              <button type="button" class="btn btn-outline-secondary size-btn" data-size="240">Vừa</button>
              <button type="button" class="btn btn-outline-secondary size-btn" data-size="320">Lớn</button>
              <button type="button" class="btn btn-outline-secondary size-btn" data-size="420">Rất lớn</button>
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-6">
              <label for="colorDark" class="form-label">Màu mã</label>
              <div class="d-flex align-items-center gap-2">
                <input type="color" class="form-control form-control-color color-swatch" id="colorDark" value="#212529">
                <span class="small text-muted" id="colorDarkHex">#212529</span>
              </div>
            </div>
            <div class="col-6">
              <label for="colorLight" class="form-label">Màu nền</label>
              <div class="d-flex align-items-center gap-2">
                <input type="color" class="form-control form-control-color color-swatch" id="colorLight" value="#ffffff">
                <span class="small text-muted" id="colorLightHex">#FFFFFF</span>
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Logo giữa QR code (tuỳ chọn)</label>
            <div class="d-flex align-items-center gap-2">
              <div class="logo-thumb" id="logoPreview">—</div>
              <input type="file" class="form-control form-control-sm" id="logoInput" accept="image/*">
              <button type="button" class="btn btn-sm btn-link text-danger d-none" id="logoClear">Xóa</button>
            </div>
          </div>

          <button class="btn btn-primary" id="genBtn">Tạo mã QR</button>
          <div class="form-text mt-2" id="hint"></div>

          <div class="text-center mt-4 d-none qr-box" id="qrWrap">
            <div class="d-inline-block p-3 bg-white border rounded" id="qrcode"></div>
            <div class="d-flex gap-2 mt-3">
              <button class="btn btn-outline-secondary btn-sm flex-fill" id="downloadBtn">Tải ảnh PNG</button>
              <button class="btn btn-outline-secondary btn-sm flex-fill" id="copyBtn">Copy</button>
            </div>
          </div>

        </div>
      </div>
				
				
            </div>
        </div>
        <footer class="footer" include-footer="footer.html">
        </footer>
    </div>
    <script src="js/jquery-3.3.1.slim.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/menu.js"></script>
    <script type="text/javascript">
			includeHTML();
			includeFooter();
		
  let currentSize = 240;
  let logoDataUrl = null;

  document.querySelectorAll('.size-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentSize = parseInt(btn.dataset.size);
    });
  });

  const linkInput = document.getElementById('link');
  const hint = document.getElementById('hint');
  const qrWrap = document.getElementById('qrWrap');
  const qrcodeDiv = document.getElementById('qrcode');
  const colorDark = document.getElementById('colorDark');
  const colorLight = document.getElementById('colorLight');
  const colorDarkHex = document.getElementById('colorDarkHex');
  const colorLightHex = document.getElementById('colorLightHex');
  const logoInput = document.getElementById('logoInput');
  const logoPreview = document.getElementById('logoPreview');
  const logoClear = document.getElementById('logoClear');

  colorDark.addEventListener('input', () => colorDarkHex.textContent = colorDark.value.toUpperCase());
  colorLight.addEventListener('input', () => colorLightHex.textContent = colorLight.value.toUpperCase());

  logoInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      logoDataUrl = ev.target.result;
      logoPreview.innerHTML = '<img src="' + logoDataUrl + '">';
      logoClear.classList.remove('d-none');
    };
    reader.readAsDataURL(file);
  });

  logoClear.addEventListener('click', () => {
    logoDataUrl = null;
    logoInput.value = '';
    logoPreview.innerHTML = '—';
    logoClear.classList.add('d-none');
  });

  document.getElementById('genBtn').addEventListener('click', generate);
  linkInput.addEventListener('keydown', e => { if(e.key === 'Enter') generate(); });

  function setHint(msg, isError){
    hint.textContent = msg;
    hint.classList.toggle('text-danger', !!isError);
    hint.classList.toggle('text-muted', !isError);
  }

  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function generate(){
    const text = linkInput.value.trim();
    if(!text){
      setHint('Vui lòng nhập link trước khi tạo mã.', true);
      linkInput.focus();
      return;
    }
    setHint('');

    const size = currentSize;
    const dark = colorDark.value;
    const light = colorLight.value;

    const temp = document.createElement('div');
    temp.style.display = 'none';
    document.body.appendChild(temp);

    new QRCode(temp, {
      text: text,
      width: size,
      height: size,
      colorDark: dark,
      colorLight: light,
      correctLevel: logoDataUrl ? QRCode.CorrectLevel.H : QRCode.CorrectLevel.M
    });

    setTimeout(() => {
      const sourceEl = temp.querySelector('canvas') || temp.querySelector('img');
      const finalize = () => {
        const finalCanvas = document.createElement('canvas');
        finalCanvas.width = size;
        finalCanvas.height = size;
        const ctx = finalCanvas.getContext('2d');
        ctx.drawImage(sourceEl, 0, 0, size, size);

        const done = () => {
          qrcodeDiv.innerHTML = '';
          qrcodeDiv.appendChild(finalCanvas);
          document.body.removeChild(temp);
          qrWrap.classList.remove('d-none');
          if(logoDataUrl){
            setHint('Đã chèn logo');
          }
        };

        if(logoDataUrl){
          const logoImg = new Image();
          logoImg.onload = () => {
            const logoSize = size * 0.22;
            const x = (size - logoSize) / 2;
            const y = (size - logoSize) / 2;
            const pad = logoSize * 0.18;
            ctx.fillStyle = light || '#ffffff';
            roundRect(ctx, x - pad, y - pad, logoSize + pad * 2, logoSize + pad * 2, 8);
            ctx.fill();
            ctx.drawImage(logoImg, x, y, logoSize, logoSize);
            done();
          };
          logoImg.onerror = done;
          logoImg.src = logoDataUrl;
        } else {
          done();
        }
      };

      if(sourceEl.tagName === 'IMG' && !sourceEl.complete){
        sourceEl.onload = finalize;
      } else {
        finalize();
      }
    }, 60);
  }

  document.getElementById('downloadBtn').addEventListener('click', () => {
    const canvas = qrcodeDiv.querySelector('canvas');
    if(!canvas) return;
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = 'ma-qr.png';
    a.click();
  });

  document.getElementById('copyBtn').addEventListener('click', async () => {
    const canvas = qrcodeDiv.querySelector('canvas');
    if(!canvas) return;
    try{
      canvas.toBlob(async blob => {
        await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
        setHint('Đã copy ảnh');
      });
    }catch(e){
      setHint('Trình duyệt không hỗ trợ copy ảnh, hãy dùng nút Tải ảnh PNG.', true);
    }
  });


		
			
    </script>
  </body>
</html>
